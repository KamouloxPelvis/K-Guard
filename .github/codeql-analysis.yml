# --- Automated SAST Pipeline for K-Guard ---
# International standard: Cisco DevNet & OSSF compliant
# Purpose: Performs static application security testing (SAST) for Python, JS, and Go installer.

name: "CodeQL Security Scan"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '20 4 * * 1'

jobs:
  analyze:
    name: Analyze Code
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript
            build-mode: none
          - language: go
            build-mode: manual 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      # Specific installation for Go
      - name: Setup Go and Download Dependencies
        if: matrix.language == 'go'
        run: |
          go version
          go mod download
          go build ./... # Force la compilation pour que CodeQL indexe les dépendances

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"