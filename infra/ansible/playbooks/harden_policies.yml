- name: "🛡️ K-Guard Sentinel - Universal Dynamic Security"
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    ansible_python_interpreter: /usr/bin/python3

  tasks:
    # ------------------------------------------------------------------------
    # 0. DISCOVERY
    # ------------------------------------------------------------------------
    - name: "🔎 Discover namespaces"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Namespace
      register: ns_list

    - name: "🔎 Discover services"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Service
      register: service_list

    - name: "📊 Detect monitoring namespace"
      ansible.builtin.set_fact:
        monitoring_enabled: >-
          {{
            'monitoring' in
            (
              ns_list.resources
              | map(attribute='metadata.name')
              | list
            )
          }}

    - name: "🧩 Build dynamic workload inventory"
      ansible.builtin.set_fact:
        discovered_workloads: >-
          [
          {% for service in service_list.resources
             if service.spec.selector is defined
             and service.spec.selector.app is defined %}
          {
            "app": "{{ service.spec.selector.app }}",
            "ns": "{{ service.metadata.namespace }}",
            "port": {{
              service.spec.ports[0].port | default(80)
            }}
          }{% if not loop.last %},{% endif %}
          {% endfor %}
          ]

    # ------------------------------------------------------------------------
    # 1. LAYER 0: Enforce Zero Trust (default deny) - all namespaces
    # ------------------------------------------------------------------------
    - name: "🔒 Sentinel: Deploy Deny-All (Core Baseline)"
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('template', '../templates/core_baseline.j2') }}"
      vars:
        ns_item: "{{ item.metadata.name }}"
      loop: "{{ ns_list.resources }}"

    # ------------------------------------------------------------------------
    # 2. LAYER 1: Common infra (DNS, API, Monitoring) - all namespaces
    # ------------------------------------------------------------------------
    - name: "🌐 Sentinel: Deploy Infra-Allowed"
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('template', '../templates/infra_allow.j2') }}"
      vars:
        ns_item: "{{ item.metadata.name }}"
        monitoring_enabled: "{{ monitoring_enabled }}"
      loop: "{{ ns_list.resources }}"

    # ------------------------------------------------------------------------
    # 2.5 LAYER 1.2: kube-system - CoreDNS external egress
    # ------------------------------------------------------------------------
    - name: "🌐 Sentinel: Allow CoreDNS external DNS egress (kube-system)"
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('template', '../templates/core_dns_egress.j2') }}"

    # ------------------------------------------------------------------------
    # 3. LAYER 2: Exemption for security stack (k-guard)
    # ------------------------------------------------------------------------
    - name: "🛡️ Sentinel: Exempt Security Stack (k-guard)"
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('template', '../templates/exempt_stack.j2') }}"
      vars:
        ns_item: "k-guard"

    # ------------------------------------------------------------------------
    # 4. INTEGRATIONS: Webex API egress
    # ------------------------------------------------------------------------
    - name: "🔓 Connectivity: Webex API Egress"
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('template', '../templates/exempt_webex.j2') }}"

    # ------------------------------------------------------------------------
    # 5. UNIVERSAL BRIDGE: Dynamic internal service-to-service bridge
    # ------------------------------------------------------------------------
    - name: "🔓 Connectivity: Dynamic Internal Bridge"
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('template', '../templates/app_internal_bridge.j2') }}"
      vars:
        app_name: "sentinel-{{ item.app }}"
        namespace: "{{ item.ns }}"
        app_label: "{{ item.app }}"
        app_port: "{{ item.port | default(80) }}"
      loop: "{{ discovered_workloads }}"
      when: item.app is defined

    # ------------------------------------------------------------------------
    # 6. EXTERNAL SERVICES: Blog MongoDB Atlas egress
    # ------------------------------------------------------------------------
    - name: "🔓 Connectivity: MongoDB Atlas Egress (blog-devopsnotes)"
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('template', '../templates/app_egress.j2') }}"
      vars:
        app_name: "sentinel-blog-db-access"
        namespace: "blog-prod"
        app_label: "blog-devopsnotes"
        egress_rules:
          - cidr: "0.0.0.0/0"
            port: 27017
            protocol: "TCP"
      when: "'blog-devopsnotes' in (discovered_workloads | map(attribute='app') | list)"

    # ------------------------------------------------------------------------
    # 7. AUDIT: Calculate security score and expose to K-Guard API
    # ------------------------------------------------------------------------
    - name: "📊 Audit: Calculate and Save Security Score"
      shell: |
        TOTAL=$(kubectl get ns --no-headers | wc -l)
        DENIED=$(kubectl get netpol -A | grep -c "sentinel-default-deny")
        SCORE=$(( DENIED * 100 / TOTAL ))
        echo "$SCORE" > /tmp/kguard_security_score
      register: security_score
