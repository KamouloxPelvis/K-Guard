apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: k-guard
  labels:
    app: fluent-bit
spec:
  selector:
    matchLabels:
      app: fluent-bit
  template:
    metadata:
      labels:
        app: fluent-bit
    spec:
      serviceAccountName: fluent-bit
      initContainers:
      - name: init-token
        image: busybox
        # Creates the directory and saves the token to the shared volume
        command: ['sh', '-c', 'mkdir -p /tmp/token && echo $WEBEX_TOKEN > /tmp/token/token.txt']
        env:
        - name: WEBEX_TOKEN
          valueFrom:
            secretKeyRef:
              name: webex-secret
              key: token
        volumeMounts:
        - name: token-volume
          mountPath: /tmp/token
      containers:
      - name: fluent-bit
        image: fluent/fluent-bit:3.0.0
        env:
        - name: WEBEX_TOKEN
          valueFrom:
            secretKeyRef:
              name: webex-secret
              key: token
        envFrom:
        - secretRef:
            name: webex-secret
        securityContext:
          runAsUser: 0
          privileged: true
        volumeMounts:
        - name: config
          mountPath: /fluent-bit/etc/
        - name: varlog
          mountPath: /var/log/containers
          readOnly: true
        - name: varlogpods
          mountPath: /var/log/pods
          readOnly: true
        - name: falco-logs
          mountPath: /var/log/falco
          readOnly: true
        - name: token-volume
          mountPath: /var/run/secrets/token
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: fluent-bit-config
      - name: varlog
        hostPath:
          path: /var/log/containers
      - name: varlogpods
        hostPath:
          path: /var/log/pods
      - name: falco-logs
        hostPath:
          path: /var/log/falco
      - name: token-volume
        emptyDir: {}
