# k8s/backend-rbac.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k-guard-sa
  namespace: k-guard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: configmap-updater
  namespace: k-guard
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["fluent-bit-config"]
  verbs: ["get", "patch", "update"]
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["fluent-bit-config"]
  verbs: ["get", "patch", "update"]
- apiGroups: ["apps"]
  resources: ["daemonsets"]
  resourceNames: ["fluent-bit"]
  verbs: ["get", "patch"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-config-update
  namespace: k-guard
subjects:
- kind: ServiceAccount
  name: k-guard-sa
  namespace: k-guard
roleRef:
  kind: Role
  name: configmap-updater
  apiGroup: rbac.authorization.k8s.io