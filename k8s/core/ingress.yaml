apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: k-guard-ingress
  namespace: k-guard
  annotations:
    kubernetes.io/ingress.class: "nginx"
    # Désactive le rewrite globalement ici si ton app frontend ne le supporte pas, 
    # ou gère le rewrite uniquement pour le frontend avec une configuration plus fine
spec:
  rules:
  - http:
      paths:
      # Kibana: on force l'absence de réécriture
      - path: /kibana
        pathType: Prefix
        backend:
          service:
            name: kibana-kb-http
            port:
              number: 5601
      # Frontend: Ton app
      - path: /
        pathType: Prefix
        backend:
          service:
            name: k-guard-service
            port:
              number: 8000