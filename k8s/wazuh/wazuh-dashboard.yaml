apiVersion: apps/v1
kind: Deployment
metadata:
  name: wazuh-dashboard
  namespace: k-guard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wazuh-dashboard
  template:
    metadata:
      labels:
        app: wazuh-dashboard
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: wazuh-dashboard
          image: wazuh/wazuh-dashboard:4.14.6
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 5601
              protocol: TCP
          env:
            - name: INDEXER_URL
              value: "https://wazuh-indexer.k-guard.svc.cluster.local:9200"
            - name: INDEXER_USERNAME
              valueFrom:
                secretKeyRef:
                  name: wazuh-dashboard-credentials
                  key: indexer-username
            - name: INDEXER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wazuh-dashboard-credentials
                  key: indexer-password
            - name: DASHBOARD_USERNAME
              value: "kibanaserver"
            - name: DASHBOARD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wazuh-dashboard-credentials
                  key: indexer-password
            - name: WAZUH_API_URL
              value: "https://wazuh-manager-service.k-guard.svc.cluster.local"
            - name: API_PORT
              value: "55000"
            - name: API_USERNAME
              valueFrom:
                secretKeyRef:
                  name: wazuh-manager-credentials
                  key: api-username
            - name: API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wazuh-manager-credentials
                  key: api-password
            - name: LOGGING_LEVEL
              value: "info"
          volumeMounts:
            - name: dashboard-config
              mountPath: /usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
              subPath: opensearch_dashboards.yml
              readOnly: true
            - name: wazuh-certs
              mountPath: /usr/share/wazuh-dashboard/config/certs
              readOnly: true
      volumes:
        - name: dashboard-config
          configMap:
            name: wazuh-dashboard-config
        - name: wazuh-certs
          secret:
            secretName: wazuh-certs
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: wazuh-dashboard
  namespace: k-guard
spec:
  type: NodePort
  selector:
    app: wazuh-dashboard
  ports:
    - name: https
      protocol: TCP
      port: 5601
      targetPort: 5601
      nodePort: 31001
