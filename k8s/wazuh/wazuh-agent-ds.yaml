apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: wazuh-agent
  namespace: k-guard
  labels:
    app: wazuh-agent
    app.kubernetes.io/name: wazuh-agent
    app.kubernetes.io/part-of: k-guard
spec:
  selector:
    matchLabels:
      app: wazuh-agent
  template:
    metadata:
      labels:
        app: wazuh-agent
        app.kubernetes.io/name: wazuh-agent
        app.kubernetes.io/part-of: k-guard
    spec:
      automountServiceAccountToken: false
      containers:
        - name: wazuh-agent
          image: wazuh/wazuh-agent:4.14.6
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: agent-config
              mountPath: /wazuh-config-mount/etc/ossec.conf
              subPath: ossec.conf
              readOnly: true
            - name: host-var-log
              mountPath: /var/log
              readOnly: true
            - name: host-root
              mountPath: /host
              readOnly: true
      volumes:
        - name: agent-config
          configMap:
            name: wazuh-agent-config
        - name: host-var-log
          hostPath:
            path: /var/log
            type: Directory
        - name: host-root
          hostPath:
            path: /
            type: Directory
