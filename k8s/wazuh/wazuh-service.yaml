apiVersion: v1
kind: Service
metadata:
  name: wazuh-manager-service
  namespace: k-guard
spec:
  selector:
    app: wazuh-manager
  ports:
    - name: agent-connection
      port: 1514
      targetPort: 1514
      protocol: TCP
    - name: enrollment
      port: 1515
      targetPort: 1515
      protocol: TCP
    - name: api
      port: 55000
      targetPort: 55000
      protocol: TCP
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: wazuh-indexer
  namespace: k-guard
spec:
  clusterIP: None
  selector:
    app: wazuh-indexer
  ports:
  - name: https
    protocol: TCP
    port: 9200
    targetPort: https
  - name: transport
    protocol: TCP
    port: 9300
    targetPort: transport
