apiVersion: v1
kind: ConfigMap
metadata:
  name: wazuh-agent-config
  namespace: k-guard
  labels:
    app: wazuh-agent
    app.kubernetes.io/name: wazuh-agent
    app.kubernetes.io/part-of: k-guard
data:
  ossec.conf: |
    <ossec_config>
      <client>
        <server>
          <address>wazuh-manager-service</address>
          <port>1514</port>
          <protocol>tcp</protocol>
        </server>

        <config-profile>kubernetes</config-profile>
        <notify_time>10</notify_time>
        <time-reconnect>60</time-reconnect>
        <auto_restart>yes</auto_restart>
        <crypto_method>aes</crypto_method>

        <enrollment>
          <enabled>no</enabled>
          <manager_address>wazuh-manager-service</manager_address>
          <port>1515</port>
          <agent_name>k8s-devopsnotes</agent_name>
        </enrollment>
      </client>

      <logging>
        <log_format>plain</log_format>
      </logging>

      <!-- Host log collection -->
      <localfile>
        <log_format>syslog</log_format>
        <location>/var/log/syslog</location>
      </localfile>

      <localfile>
        <log_format>syslog</log_format>
        <location>/var/log/auth.log</location>
      </localfile>

      <!-- File Integrity Monitoring: host configuration only -->
      <syscheck>
        <disabled>no</disabled>
        <frequency>43200</frequency>
        <scan_on_start>yes</scan_on_start>
        <alert_new_files>yes</alert_new_files>

        <directories check_all="yes" realtime="yes">/host/etc</directories>
        <directories check_all="yes" realtime="yes">/host/var/lib/rancher/k3s/server/manifests</directories>
        <directories check_all="yes" realtime="yes">/host/var/lib/rancher/k3s/server/cred</directories>

        <ignore type="sregex">\.swp$|~$|\.tmp$</ignore>
      </syscheck>

      <!-- System inventory: OS, packages, ports, processes -->
      <wodle name="syscollector">
        <disabled>no</disabled>
        <interval>1h</interval>
        <scan_on_start>yes</scan_on_start>

        <hardware>yes</hardware>
        <os>yes</os>
        <network>yes</network>
        <packages>yes</packages>
        <ports all="no">yes</ports>
        <processes>yes</processes>
      </wodle>
    </ossec_config>
