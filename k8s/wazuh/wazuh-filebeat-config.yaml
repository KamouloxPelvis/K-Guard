apiVersion: v1
kind: ConfigMap
metadata:
  name: wazuh-filebeat-config
  namespace: k-guard
data:
  filebeat.yml: |
    filebeat.inputs:
      - type: log
        enabled: true
        paths:
          - /var/ossec/logs/alerts/alerts.json
        json.keys_under_root: true
        json.overwrite_keys: true

    filebeat.modules:
      - module: wazuh
        alerts:
          enabled: true
        archives:
          enabled: false

    output.elasticsearch:
      hosts: ["wazuh-indexer.k-guard.svc.cluster.local:9200"]
      protocol: "http"
