apiVersion: v1
kind: Pod
metadata:
  annotations: {}
  name: wazuh-indexer-init
  namespace: k-guard
spec:
  containers:
    - command:
        - /bin/bash
        - -lc
        - sleep infinity
      image: wazuh/wazuh-indexer:4.14.6
      imagePullPolicy: IfNotPresent
      name: init
      resources: {}
      securityContext:
        runAsUser: 0
      terminationMessagePath: /dev/termination-log
      terminationMessagePolicy: File
      volumeMounts:
        - mountPath: /etc/wazuh-indexer
          name: security-root
        - mountPath: /usr/share/wazuh-indexer/config/certs
          name: certs
          readOnly: true
        - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          name: kube-api-access-sxtc6
          readOnly: true
  dnsPolicy: ClusterFirst
  enableServiceLinks: true
  nodeName: devopsnotes
  preemptionPolicy: PreemptLowerPriority
  priority: 0
  restartPolicy: Never
  schedulerName: default-scheduler
  securityContext: {}
  serviceAccount: default
  serviceAccountName: default
  terminationGracePeriodSeconds: 30
  tolerations:
    - effect: NoExecute
      key: node.kubernetes.io/not-ready
      operator: Exists
      tolerationSeconds: 300
    - effect: NoExecute
      key: node.kubernetes.io/unreachable
      operator: Exists
      tolerationSeconds: 300
  volumes:
    - emptyDir: {}
      name: security-root
    - name: certs
      secret:
        defaultMode: 420
        secretName: wazuh-certs
    - name: kube-api-access-sxtc6
      projected:
        defaultMode: 420
        sources:
          - serviceAccountToken:
              expirationSeconds: 3607
              path: token
          - configMap:
              items:
                - key: ca.crt
                  path: ca.crt
              name: kube-root-ca.crt
          - downwardAPI:
              items:
                - fieldRef:
                    apiVersion: v1
                    fieldPath: metadata.namespace
                  path: namespace
